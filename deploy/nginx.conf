# Reverse proxy sesuai DDT Section 2 & 9 — dua subdomain, dua aplikasi Next.js.
# TLS/Let's Encrypt sengaja tidak dimasukkan di file dev ini; untuk produksi,
# tambahkan blok certbot/443 terpisah sesuai domain riil Pemkab Boyolali.

upstream simonev_ops {
    server simonev-ops:3000;
}

upstream simonev_eksekutif {
    server simonev-eksekutif:3001;
}

server {
    listen 80;
    server_name ops.simonev.boyolali.go.id;

    location / {
        proxy_pass http://simonev_ops;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dashboard.simonev.boyolali.go.id;

    location / {
        proxy_pass http://simonev_eksekutif;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
