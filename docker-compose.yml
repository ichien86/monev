name: simonev-boyolali

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status() } catch (e) { rs.initiate() }"
      interval: 5s
      timeout: 5s
      retries: 10

  simonev-ops:
    build:
      context: .
      dockerfile: apps/ops/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI_CORE: mongodb://mongodb:27017/simonev_core?replicaSet=rs0
      MONGODB_URI_READMODEL: mongodb://mongodb:27017/simonev_readmodel?replicaSet=rs0
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL_OPS:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "3000:3000"

  simonev-agenda-worker:
    build:
      context: .
      dockerfile: apps/ops/Dockerfile
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI_CORE: mongodb://mongodb:27017/simonev_core?replicaSet=rs0
      MONGODB_URI_READMODEL: mongodb://mongodb:27017/simonev_readmodel?replicaSet=rs0
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

  simonev-eksekutif:
    build:
      context: .
      dockerfile: apps/eksekutif/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # Sengaja HANYA MONGODB_URI_READMODEL — lihat DDT Section 2 & 4.A.
      # Pengecualian: MONGODB_URI_CORE tetap diperlukan untuk query login
      # (koleksi `users`), lihat catatan di apps/eksekutif/src/auth.ts.
      MONGODB_URI_CORE: mongodb://mongodb:27017/simonev_core?replicaSet=rs0
      MONGODB_URI_READMODEL: mongodb://mongodb:27017/simonev_readmodel?replicaSet=rs0
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL_EKSEKUTIF:-http://localhost:3001}
    ports:
      - "3001:3001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - simonev-ops
      - simonev-eksekutif
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  mongo-data:
